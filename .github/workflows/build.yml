name: Build NoWatermark APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）
      # 且已预装 platforms;android-35 与 build-tools;35.0.0，并且已接受 SDK 许可。
      # 因此正常路径下完全不需要调用 sdkmanager，更不要 chmod 系统文件（会 Operation not permitted）。
      # 仅在组件确实缺失时才兜底尝试 sdkmanager，且全程容错、不中断构建。
      # 不使用 android-actions/setup-android@v3（该版本硬装已下线的 tools 包，必失败）。
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi

          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head -20 || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | head -20 || true

          # 只在必需组件缺失时才尝试 sdkmanager；已预装则零写操作直接跳过。
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Required SDK components missing; trying sdkmanager as fallback..."
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)
            if [ -z "$SDKMGR" ]; then
              echo "::warning::sdkmanager not found; build may fail if components are truly missing"
            else
              echo "Using sdkmanager: $SDKMGR"
              # 不 chmod：镜像预装文件属系统所有，chmod 会 Operation not permitted。
              # 许可接受放子 shell 吞掉 yes 的 141；安装失败仅告警，不中断。
              ( set +e +o pipefail; yes | "$SDKMGR" --licenses > /dev/null 2>&1; true )
              "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                || echo "::warning::sdkmanager install failed; build may still work with preinstalled components"
            fi
          else
            echo "SDK components already installed; no sdkmanager action needed."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias nowatermark -storepass android -keypass android \
            -dname "CN=NoWatermark, OU=SoPro, O=SoPro, L=Shanghai, S=Shanghai, C=CN"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: nowatermark
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoWatermark-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
