name: Build NoWatermark APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 并设好 ANDROID_HOME，
      # 直接用镜像自带的 sdkmanager，不再依赖 android-actions/setup-android
      # （该 action v3 会硬装已下线的 tools 包而失败）。
      - name: Install build tools & platform 35
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK root: $ANDROID_HOME"
          # 预接受 SDK 许可（pipe 到 yes 会产生 141，忽略之）
          set +e +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1
          set -e -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias nowatermark -storepass android -keypass android \
            -dname "CN=NoWatermark, OU=SoPro, O=SoPro, L=Shanghai, S=Shanghai, C=CN"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: nowatermark
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoWatermark-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
