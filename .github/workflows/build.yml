name: Build NoWatermark APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools & platform 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias nowatermark -storepass android -keypass android \
            -dname "CN=NoWatermark, OU=SoPro, O=SoPro, L=Shanghai, S=Shanghai, C=CN"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: nowatermark
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoWatermark-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
